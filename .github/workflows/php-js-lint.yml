name: PHP and JavaScript syntax
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          node --check js/rpg.js
          node --check js/battle.js
          node --check js/save-status.js
          node --check js/i18n.js
          node --check js/battle-api.js
          node --check js/audio.js
          node --check js/tutorial.js
          node --check js/characters.js
          node --check js/character-setup.js
          node --check js/google-signin.js
          node --check js/quest-api.js
          node --check js/battle-review.js
          node --check js/quest-guidance.js
          node --check js/pixel-world.js
          node --check js/story-visuals.js
          node --check js/learning.js
          node --check js/skills.js
      - name: Gameplay regression tests
        run: |
          node --test tests/*.test.cjs
          php tests/battle_rules_test.php
          php tests/tutorial_state_test.php
          php tests/google_token_test.php
          php tests/progression_test.php
          php tests/battle_review_test.php
          php tests/themed_questions_test.php

  mysql-guest-flow:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: ["mysql:8.0", "mariadb:10.4"]
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare database, including old-schema migration simulation
        run: |
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/english_power_quest_schema.sql
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/demo_seed.sql
          test "$(mysql -h 127.0.0.1 -uroot -ptestpassword -N -s english_power_quest -e "SELECT w.world_order FROM players p JOIN users u ON u.user_id=p.user_id JOIN worlds w ON w.world_id=p.current_world_id WHERE u.username='demo'")" = 1
          mysql -h 127.0.0.1 -uroot -ptestpassword english_power_quest -e "
            DROP TABLE verified_quest_events;
            DROP TABLE verified_typing_runs;
            DROP TABLE verified_quest_claims;
            DROP TABLE verified_story_progress;
            DROP TABLE verified_answer_attempts;
            DROP TABLE verified_battle_events;
            DROP TABLE verified_battles;
            DROP TABLE guest_login_tokens;
            DROP TABLE player_game_saves;
            DROP TABLE player_character_profiles;
            ALTER TABLE users DROP COLUMN google_sub, DROP COLUMN account_type;
            DELETE FROM worlds WHERE world_order > 1;
            UPDATE worlds SET world_name='Dreamwood' WHERE world_order=1;
          "
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/003_persistent_guests.sql
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/004_four_worlds.sql
          before=$(mysql -h 127.0.0.1 -uroot -ptestpassword -N -s english_power_quest -e "SELECT CONCAT(player_id,':',user_id,':',display_name,':',xp_total,':',coins_total,':',story_intro_seen) FROM players ORDER BY player_id")
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/005_verified_battles.sql
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/005_verified_battles.sql
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/006_character_profiles.sql
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/006_character_profiles.sql
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/007_verified_quests.sql
          mysql -h 127.0.0.1 -uroot -ptestpassword < database/migrations/007_verified_quests.sql
          after=$(mysql -h 127.0.0.1 -uroot -ptestpassword -N -s english_power_quest -e "SELECT CONCAT(player_id,':',user_id,':',display_name,':',xp_total,':',coins_total,':',story_intro_seen) FROM players ORDER BY player_id")
          test "$before" = "$after"
      - name: Guest, Story, save and upgrade smoke test
        env:
          EPQ_DB_HOST: 127.0.0.1
          EPQ_DB_USER: root
          EPQ_DB_PASS: testpassword
          EPQ_DB_NAME: english_power_quest
        run: bash tests/guest_flow_smoke.sh
      - name: Google signed-token HTTP fixtures (not real Google consent)
        env:
          EPQ_DB_HOST: 127.0.0.1
          EPQ_DB_USER: root
          EPQ_DB_PASS: testpassword
          EPQ_DB_NAME: english_power_quest
          EPQ_BATTLE_TEST_DB: isolated
          EPQ_GOOGLE_CLIENT_ID: 1234567890-fixture.apps.googleusercontent.com
        run: |
          export EPQ_GOOGLE_TEST_SESSION_PATH=$(mktemp -d /tmp/epq-google-sessions-XXXXXX)
          php -d "session.save_path=$EPQ_GOOGLE_TEST_SESSION_PATH" -S 127.0.0.1:8081 -t /tmp/epq_web >/tmp/epq_google_server.log 2>&1 &
          google_server_pid=$!
          trap 'kill "$google_server_pid" || true; cat /tmp/epq_google_server.log' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8081/FYP/login.php >/dev/null
          php -d "session.save_path=$EPQ_GOOGLE_TEST_SESSION_PATH" tests/google_http_smoke.php
