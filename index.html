<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102533">
  <meta name="description" content="English Power Quest - a story-driven English learning RPG.">
  <title>English Power Quest</title>
  <link rel="stylesheet" href="/FYP/css/style.css">
</head>
<body>
  <div class="game-shell">
    <canvas id="gameCanvas" aria-label="English Power Quest world"></canvas>

    <div class="hud">
      <div class="brand">
        <span class="brand-kicker">ENGLISH POWER QUEST</span>
        <strong>Dreamwood</strong>
      </div>

      <div class="hud-stats">
        <div class="stat"><span>LV</span><b id="levelText">1</b></div>
        <div class="stat"><span>XP</span><b id="xpText">0</b></div>
        <div class="stat"><span>POWER</span><b id="powerText">0</b></div>
        <div class="stat coins"><span>◈</span><b id="coinsText">0</b></div>
      </div>

      <div class="quest-card" id="questCard">
        <span class="quest-label">CURRENT QUEST</span>
        <strong id="questTitle">The First Words</strong>
        <p id="questText">Find the village elder.</p>
      </div>
    </div>

    <div class="dialogue hidden" id="dialogue">
      <div class="dialogue-name" id="dialogueName">Elder Rowan</div>
      <p id="dialogueText">Welcome, traveller.</p>
      <button id="dialogueButton">Continue</button>
    </div>

    <div class="location-pill" id="locationText">MAPLE ROAD</div>

    <div class="controls" aria-label="Movement controls">
      <button class="move-button" id="leftButton" aria-label="Move left">◀</button>
      <button class="move-button" id="rightButton" aria-label="Move right">▶</button>
      <button class="interact-button" id="interactButton" aria-label="Interact">E</button>
    </div>

    <div class="hint">← A / D → &nbsp; • &nbsp; E / SPACE interact</div>
  </div>

  <script type="module" src="/FYP/js/rpg.js"></script>
</body>
</html>
