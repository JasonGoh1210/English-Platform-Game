  <!-- dark scarf / chest -->
  <path d="M51 58 L64 69 L77 58 L73 74 L64 82 L55 74 Z" fill="#0b0b11"/>
  <rect x="58" y="64" width="12" height="5" fill="#302a43"/>

  <!-- boots -->
