  <rect x="33" y="84" width="7" height="7" fill="#caa98d"/>
  <rect x="88" y="83" width="7" height="7" fill="#caa98d"/>

  <!-- neck -->
  <rect x="58" y="55" width="12" height="12" fill="#caa98d"/>

  <!-- head -->
