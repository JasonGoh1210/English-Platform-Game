<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="cloak" x1="0" x2="1">
      <stop offset="0" stop-color="#08090e"/>
      <stop offset=".5" stop-color="#1b1827"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a12"/>
      <stop offset=".55" stop-color="#29223a"/>
      <stop offset="1" stop-color="#07070c"/>
    </linearGradient>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="64" cy="118" rx="31" ry="6" fill="#000" opacity=".35"/>

  <!-- long cloak / coat -->
