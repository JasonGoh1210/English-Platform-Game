<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48">
  <title>Dark adventurer walking left, frame 6</title>
  <g shape-rendering="crispEdges">
    <ellipse cx="16" cy="45.5" rx="11" ry="1.5" fill="#090b0f" opacity=".45"/>
    <g transform="translate(32 0) scale(-1 1)">
      <!-- trailing cape -->
      <path d="M8 15 L4 18 L5 29 L2 35 L9 37 L12 31 L11 21 Z" fill="#111319" stroke="#08090d" stroke-width=".7"/>
      <path d="M6 23 L4 34 L8 33 L10 24 Z" fill="#252932"/>
      <!-- back leg and boot -->
      <rect x="9" y="33" width="5" height="9" fill="#252a32" />
      <rect x="10" y="35" width="2" height="6" fill="#3a3f49" />
      <rect x="7" y="40" width="8" height="3" fill="#0d1016" />
      <rect x="8" y="40" width="6" height="1" fill="#3b414b" />
      <!-- front leg and boot -->
      <rect x="18" y="34" width="5" height="8" fill="#1b2028" />
      <rect x="19" y="36" width="2" height="5" fill="#343a44" />
      <rect x="18" y="41" width="8" height="3" fill="#090c12" />
      <rect x="19" y="41" width="6" height="1" fill="#404651" />
      <!-- long coat -->
      <path d="M11 15 L21 15 L24 25 L22 35 L19 36 L17 27 L15 36 L10 35 L9 25 Z" fill="#292e36" stroke="#0a0c11" stroke-width=".8"/>
      <path d="M12 17 L14 25 L12 32 L10 34 L10 24 Z" fill="#3c414b"/>
      <path d="M19 17 L21 25 L19 33 L17 35 L18 26 Z" fill="#181c23"/>
      <path d="M15 17 L16 29 L14 34 L16 35 L18 29 L17 17 Z" fill="#090d12"/>
      <path d="M14 19 L17 20 L16 23 L14 22 Z" fill="#9da5ad"/>
      <!-- hood collar and straps -->
      <path d="M10 15 L12 12 L20 12 L23 16 L19 20 L15 18 Z" fill="#171b22"/>
      <path d="M12 15 L16 18 L20 15" fill="none" stroke="#59616c" stroke-width=".7"/>
      <!-- rear arm -->
      <rect x="8" y="19" width="4" height="7" fill="#171b22" />
      <rect x="9" y="21" width="2" height="4" fill="#343a43" />
      <rect x="8" y="25" width="4" height="2" fill="#bea38b" />
      <!-- front arm -->
      <rect x="20" y="20" width="4" height="8" fill="#292e36" />
      <rect x="21" y="22" width="2" height="5" fill="#4a505a" />
      <rect x="20" y="27" width="4" height="2" fill="#c5ab91" />
      <!-- neck and pale face -->
      <rect x="14" y="11" width="5" height="4" fill="#c5a68e" />
      <path d="M12 6 L20 5 L23 9 L21 13 L17 15 L12 12 L10 9 Z" fill="#151820" stroke="#07090e" stroke-width=".8"/>
      <rect x="16" y="8" width="6" height="4" fill="#d2b49a" />
      <rect x="20" y="9" width="2" height="2" fill="#f0d4b8" />
      <rect x="21" y="10" width="2" height="1" fill="#17191e" />
      <!-- tousled black hair -->
      <path d="M9 9 L10 4 L13 3 L15 1.5 L18 2.5 L20 2 L23 5 L22 9 L19 7 L17 8 L14 6 L12 10 Z" fill="#0a0d13" stroke="#07090d" stroke-width=".6"/>
      <path d="M12 4 L15 3 L17 5 L19 4 L21 6 L17 6 L15 7 L12 6 Z" fill="#303641"/>
      <rect x="10" y="8" width="3" height="3" fill="#11151b" />
      <!-- chest buckle -->
      <rect x="16" y="22" width="2" height="3" fill="#a4aab2" />
      <rect x="16.5" y="22.5" width="1" height="2" fill="#22272f" />
    </g>
  </g>
</svg>